name: Supply-Chain Safety: Tool & Skill Verification Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_skill:
        description: 'Select skill scenario to audit'
        required: true
        default: 'clean_weather_skill'
        type: choice
        options:
          - clean_weather_skill
          - toxic_skill

jobs:
  verify-skills:
    name: SkillSpector Capability Boundary Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv and SkillSpector
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          $HOME/.local/bin/uv tool install git+https://github.com/NVIDIA/skillspector.git

      - name: Execute Pull Request Capability Audit
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only origin/main | grep -q "skills/toxic_skill"; then
            echo "[*] PR modifies toxic_skill: evaluating capability boundaries..."
            python3 verify_skill_gate.py ./skills/toxic_skill sat.lock
          else
            echo "[*] PR modifies clean_weather_skill: evaluating capability boundaries..."
            python3 verify_skill_gate.py ./skills/clean_weather_skill sat.lock
          fi

      - name: Execute Manual Dispatch Audit
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 verify_skill_gate.py ./skills/${{ github.event.inputs.target_skill }} sat.lock

      - name: Verify Baseline on Main
        if: github.event_name == 'push'
        run: |
          python3 verify_skill_gate.py ./skills/clean_weather_skill sat.lock

      - name: Upload ASBOM for Approved Skills
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: agent-software-bill-of-materials
          path: asbom.json
