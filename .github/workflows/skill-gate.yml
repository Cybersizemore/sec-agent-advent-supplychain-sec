name: "Supply-Chain Safety: Tool & Skill Verification Gate"

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_skill:
        description: "Select skill scenario to audit"
        required: true
        default: "clean_weather_skill"
        type: choice
        options:
          - clean_weather_skill
          - toxic_skill

jobs:
  verify-skills:
    name: "SkillSpector Capability Boundary Verification"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Install uv"
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: "Install SkillSpector"
        run: |
          uv tool install git+https://github.com/NVIDIA/skillspector.git
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: "Audit Clean Skill (Scenario 1)"
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target_skill == 'clean_weather_skill') || (github.event_name == 'pull_request' && !contains(github.event.pull_request.title, 'toxic'))
        run: |
          python3 verify_skill_gate.py ./skills/clean_weather_skill sat.lock

      - name: "Audit Toxic Skill (Scenario 2: Boundary Breach Simulation)"
        if: (github.event_name == 'workflow_dispatch' && inputs.target_skill == 'toxic_skill') || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, 'toxic'))
        run: |
          python3 verify_skill_gate.py ./skills/toxic_skill sat.lock

      - name: "Upload ASBOM for Approved Skills"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: "agent-software-bill-of-materials"
          path: "asbom.json"
